name: appflutter
description: Application Flutter de détection d'objets hors-ligne
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Camera package for photo capture
  camera: ^0.10.5+5
  
  # TFLite packages for object detection
  tflite_flutter: ^0.10.4
  tflite_flutter_helper: ^0.3.1
  
  # Image picker for gallery selection
  image_picker: ^1.0.5
  
  # Image processing library
  image: ^4.1.3
  
  # Permission handling
  permission_handler: ^11.0.1
  
  # Path provider for local storage
  path_provider: ^2.1.1
  
  # Internationalization
  intl: ^0.18.1
  
  # Shared preferences for settings
  shared_preferences: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  
  # Assets configuration
  assets:
    - assets/models/
    - assets/labels/
  
  # Localization
  generate: true
